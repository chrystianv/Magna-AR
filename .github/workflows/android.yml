name: Android validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:bundleRelease --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: magna-ar-build-and-reports
          path: |
            app/build/reports/
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
